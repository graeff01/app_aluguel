# Testes obrigatórios antes de publicar: o Railway só faz deploy quando esta verificação passa (checkSuites em .railway/railway.ts).
# A cada alteração (push/PR): verificação rápida (tipos, unidade/integração e build).
# Bateria completa com os fluxos E2E (celular e desktop): uma vez por dia, às 22h de Brasília, ou manualmente.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 1 * * *" # 22:00 em Brasília (UTC-3)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visitas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/visitas_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/visitas_e2e
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/visitas_test
      PW_CHANNEL: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Testes de unidade e integração (Postgres real, Google simulado)
        run: npm test
      - name: Build de produção
        run: npm run build
      - name: Banco E2E
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "create database visitas_e2e"
      - name: Navegador do Playwright
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps chromium
      - name: Fluxos E2E (celular e desktop)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
