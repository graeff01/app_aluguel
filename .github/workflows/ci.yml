# Testes obrigatórios antes de publicar: o Railway só faz deploy quando esta verificação passa (checkSuites em .railway/railway.ts).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visitas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/visitas_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/visitas_e2e
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/visitas_test
      PW_CHANNEL: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Testes de unidade e integração (Postgres real, Google simulado)
        run: npm test
      - name: Build de produção
        run: npm run build
      - name: Banco E2E
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "create database visitas_e2e"
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Fluxos E2E (celular e desktop)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
