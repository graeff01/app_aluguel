<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão</title>
    <style>
      body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f7f8fa; color: #16202a; margin: 0; }
      main { max-width: 28rem; margin: 0 auto; padding: 4rem 1.25rem; }
      h1 { font-size: 1.5rem; }
      p { color: #4a5866; line-height: 1.5; }
      button { min-height: 3rem; padding: 0 1.25rem; border-radius: 0.75rem; border: 0; background: #1f5f8b; color: #fff; font-size: 1rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexão</h1>
      <p>O Visitas Locação precisa de internet para mostrar e salvar visitas. Nenhum dado é guardado offline neste aparelho.</p>
      <p>Assim que a conexão voltar, toque em tentar novamente.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
